<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>✏️ Edit Course</h1>

    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form th:action="@{/courses/edit/{id}(id=${course.id})}" th:object="${course}" method="post">
        <div class="form-group">
            <label>Course Code:</label>
            <input type="text" th:field="*{courseCode}" readonly>
        </div>

        <div class="form-group">
            <label>Course Name:</label>
            <input type="text" th:field="*{courseName}" required>
        </div>

        <div class="form-group">
            <label>Credits:</label>
            <input type="number" th:field="*{credits}" required>
        </div>

        <div class="form-group">
            <label>Instructor:</label>
            <input type="text" th:field="*{instructor}">
        </div>

        <div class="form-group">
            <label>Capacity:</label>
            <input type="number" th:field="*{capacity}" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Course</button>
            <a href="/courses" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
