<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaPro | Register Student for Course</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Inter', sans-serif;
          background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
          min-height: 100vh;
        }

        /* Main Container */
        .main-container {
          max-width: 900px;
          margin: 0 auto;
          padding: 30px;
        }

        /* Top Bar */
        .top-bar {
          background: white;
          border-radius: 20px;
          padding: 20px 30px;
          margin-bottom: 30px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .logo {
          font-size: 24px;
          font-weight: 800;
          background: linear-gradient(135deg, #4f46e5, #06b6d4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .back-btn {
          padding: 10px 24px;
          background: #f1f5f9;
          color: #475569;
          border-radius: 30px;
          text-decoration: none;
          font-weight: 600;
          transition: all 0.3s;
        }

        .back-btn:hover {
          background: #4f46e5;
          color: white;
        }

        /* Page Header */
        .page-header {
          background: linear-gradient(135deg, #4f46e5, #06b6d4);
          border-radius: 24px;
          padding: 35px 40px;
          margin-bottom: 30px;
          color: white;
          position: relative;
          overflow: hidden;
        }

        .page-header::before {
          content: '✏️';
          position: absolute;
          bottom: -20px;
          right: 20px;
          font-size: 100px;
          opacity: 0.1;
        }

        .page-header h1 {
          font-size: 28px;
          font-weight: 700;
          margin-bottom: 10px;
        }

        .page-header p {
          opacity: 0.8;
          font-size: 14px;
        }

        /* Stats Cards */
        .stats-row {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
          margin-bottom: 30px;
        }

        .stat-card {
          background: white;
          border-radius: 20px;
          padding: 20px;
          text-align: center;
          transition: all 0.3s;
          box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .stat-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .stat-number {
          font-size: 28px;
          font-weight: 800;
          color: #4f46e5;
        }

        .stat-label {
          font-size: 12px;
          color: #64748b;
          margin-top: 5px;
        }

        /* Form Card */
        .form-card {
          background: white;
          border-radius: 24px;
          padding: 35px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Form Groups */
        .form-group {
          margin-bottom: 30px;
        }

        .form-group label {
          display: block;
          font-size: 14px;
          font-weight: 600;
          color: #1e293b;
          margin-bottom: 10px;
        }

        .form-group label .required {
          color: #ef4444;
          margin-left: 4px;
        }

        .input-wrapper {
          position: relative;
          display: flex;
          align-items: center;
        }

        .input-icon {
          position: absolute;
          left: 14px;
          color: #94a3b8;
          font-size: 14px;
          z-index: 1;
        }

        .form-group select {
          width: 100%;
          padding: 14px 16px 14px 42px;
          border: 2px solid #e2e8f0;
          border-radius: 14px;
          font-size: 14px;
          transition: all 0.3s;
          background: #f8fafc;
          font-family: 'Inter', sans-serif;
          cursor: pointer;
          appearance: none;
        }

        .form-group select:focus {
          outline: none;
          border-color: #4f46e5;
          background: white;
          box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        .form-group select.valid {
          border-color: #10b981;
          background: #ecfdf5;
        }

        .form-group select.invalid {
          border-color: #ef4444;
          background: #fef2f2;
        }

        /* Dropdown Arrow */
        .dropdown-arrow {
          position: absolute;
          right: 14px;
          color: #94a3b8;
          pointer-events: none;
        }

        /* Validation Messages */
        .validation-message {
          font-size: 11px;
          margin-top: 8px;
          margin-left: 10px;
          display: flex;
          align-items: center;
          gap: 5px;
          font-weight: 500;
        }

        .validation-message.error {
          color: #ef4444;
        }

        .validation-message.success {
          color: #10b981;
        }

        .validation-message i {
          font-size: 10px;
        }

        /* Selected Info Cards */
        .selected-info {
          background: #f8fafc;
          border-radius: 16px;
          padding: 20px;
          margin-top: 20px;
          display: none;
          animation: fadeIn 0.3s ease;
        }

        .selected-info.show {
          display: block;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(-10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .info-row {
          display: flex;
          justify-content: space-between;
          padding: 10px 0;
          border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
          border-bottom: none;
        }

        .info-label {
          font-size: 12px;
          font-weight: 600;
          color: #64748b;
        }

        .info-value {
          font-size: 14px;
          font-weight: 500;
          color: #1e293b;
        }

        .info-badge {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
        }

        .badge-available {
          background: #d1fae5;
          color: #059669;
        }

        .badge-full {
          background: #fee2e2;
          color: #dc2626;
        }

        /* Action Buttons */
        .form-actions {
          display: flex;
          gap: 15px;
          margin-top: 30px;
          padding-top: 25px;
          border-top: 1px solid #e2e8f0;
        }

        .btn-register {
          padding: 14px 32px;
          background: linear-gradient(135deg, #4f46e5, #06b6d4);
          color: white;
          border: none;
          border-radius: 14px;
          cursor: pointer;
          font-weight: 600;
          font-size: 14px;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          transition: all 0.3s;
        }

        .btn-register:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(79,70,229,0.3);
        }

        .btn-cancel {
          padding: 14px 32px;
          background: white;
          color: #64748b;
          border: 2px solid #e2e8f0;
          border-radius: 14px;
          cursor: pointer;
          font-weight: 600;
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          transition: all 0.3s;
        }

        .btn-cancel:hover {
          background: #f1f5f9;
          border-color: #cbd5e1;
        }

        .btn-register:disabled {
          opacity: 0.6;
          cursor: not-allowed;
        }

        /* Toast Message */
        .toast {
          position: fixed;
          bottom: 30px;
          right: 30px;
          background: white;
          padding: 12px 24px;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.1);
          display: flex;
          align-items: center;
          gap: 10px;
          z-index: 1000;
          animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }

        .toast.error { border-left: 4px solid #ef4444; }

        /* Responsive */
        @media (max-width: 768px) {
          .main-container { padding: 20px; }
          .stats-row { grid-template-columns: 1fr; }
          .form-card { padding: 25px; }
          .form-actions { flex-direction: column; }
          .page-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">AcademiaPro</div>
        <a href="/registrations" class="back-btn"><i class="fas fa-arrow-left"></i> Cancel & Back</a>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="fas fa-user-graduate"></i> Register Student for Course</h1>
        <p>Select a student and course to complete registration</p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number" th:text="${students.size()}">0</div>
            <div class="stat-label">Active Students</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${courses.size()}">0</div>
            <div class="stat-label">Available Courses</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="selectedCount">-</div>
            <div class="stat-label">Selected</div>
        </div>
    </div>

    <!-- Error Toast -->
    <div th:if="${error}" class="toast error" id="errorToast">
        <i class="fas fa-exclamation-circle" style="color: #ef4444;"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Form Card -->
    <div class="form-card">
        <form id="registerForm" th:action="@{/registrations/register}" method="post" onsubmit="return validateForm()">

            <!-- Select Student -->
            <div class="form-group">
                <label>Select Student <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <select id="studentId" name="studentId" required>
                        <option value="">-- Select Student --</option>
                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.fullName + ' (' + student.studentId + ')'}"
                                th:data-email="${student.email}"
                                th:data-phone="${student.phone}">
                        </option>
                    </select>
                    <i class="fas fa-chevron-down dropdown-arrow"></i>
                </div>
                <div class="validation-message" id="studentMsg">
                    <i class="fas fa-info-circle"></i> <span>Please select a student</span>
                </div>
            </div>

            <!-- Student Info Card -->
            <div id="studentInfo" class="selected-info">
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="info-value" id="studentEmail">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-phone"></i> Phone</span>
                    <span class="info-value" id="studentPhone">-</span>
                </div>
            </div>

            <!-- Select Course -->
            <div class="form-group">
                <label>Select Course <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-book input-icon"></i>
                    <select id="courseId" name="courseId" required>
                        <option value="">-- Select Course --</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseCode + ' - ' + course.courseName + ' (Available: ' + course.availableSeats + ')'}"
                                th:data-credits="${course.credits}"
                                th:data-instructor="${course.instructor}"
                                th:data-capacity="${course.capacity}"
                                th:data-enrolled="${course.enrolledCount}"
                                th:data-available="${course.availableSeats}">
                        </option>
                    </select>
                    <i class="fas fa-chevron-down dropdown-arrow"></i>
                </div>
                <div class="validation-message" id="courseMsg">
                    <i class="fas fa-info-circle"></i> <span>Please select a course</span>
                </div>
            </div>

            <!-- Course Info Card -->
            <div id="courseInfo" class="selected-info">
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-chalkboard-user"></i> Instructor</span>
                    <span class="info-value" id="courseInstructor">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-star"></i> Credits</span>
                    <span class="info-value" id="courseCredits">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-users"></i> Enrollment Status</span>
                    <span class="info-value" id="courseStatus">-</span>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-register" id="submitBtn">
                    <i class="fas fa-check-circle"></i> Register Student
                </button>
                <a href="/registrations" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // Get data attributes
    function getStudentData() {
      const select = document.getElementById('studentId');
      const selectedOption = select.options[select.selectedIndex];
      return {
        email: selectedOption?.getAttribute('th:data-email') || selectedOption?.dataset.email || '-',
        phone: selectedOption?.getAttribute('th:data-phone') || selectedOption?.dataset.phone || '-'
      };
    }

    function getCourseData() {
      const select = document.getElementById('courseId');
      const selectedOption = select.options[select.selectedIndex];
      return {
        credits: selectedOption?.getAttribute('th:data-credits') || selectedOption?.dataset.credits || '-',
        instructor: selectedOption?.getAttribute('th:data-instructor') || selectedOption?.dataset.instructor || '-',
        enrolled: selectedOption?.getAttribute('th:data-enrolled') || selectedOption?.dataset.enrolled || '0',
        capacity: selectedOption?.getAttribute('th:data-capacity') || selectedOption?.dataset.capacity || '0',
        available: selectedOption?.getAttribute('th:data-available') || selectedOption?.dataset.available || '0'
      };
    }

    // Show student info
    function showStudentInfo() {
      const studentSelect = document.getElementById('studentId');
      const studentInfo = document.getElementById('studentInfo');
      const studentMsg = document.getElementById('studentMsg');

      if (studentSelect.value !== '') {
        const data = getStudentData();
        document.getElementById('studentEmail').innerText = data.email || '-';
        document.getElementById('studentPhone').innerText = data.phone || '-';
        studentInfo.classList.add('show');
        studentSelect.classList.add('valid');
        studentSelect.classList.remove('invalid');
        studentMsg.innerHTML = '<i class="fas fa-check-circle"></i> <span>Student selected</span>';
        studentMsg.classList.add('success');
        studentMsg.classList.remove('error');
      } else {
        studentInfo.classList.remove('show');
        studentSelect.classList.add('invalid');
        studentSelect.classList.remove('valid');
        studentMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>Please select a student</span>';
        studentMsg.classList.add('error');
        studentMsg.classList.remove('success');
      }
      updateSelectedCount();
      validateFormFields();
    }

    // Show course info
    function showCourseInfo() {
      const courseSelect = document.getElementById('courseId');
      const courseInfo = document.getElementById('courseInfo');
      const courseMsg = document.getElementById('courseMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (courseSelect.value !== '') {
        const data = getCourseData();
        document.getElementById('courseInstructor').innerText = data.instructor || '-';
        document.getElementById('courseCredits').innerText = data.credits + ' Credits' || '-';

        const available = parseInt(data.available);
        const enrolled = parseInt(data.enrolled);
        const capacity = parseInt(data.capacity);

        let statusHtml = '';
        if (available > 0) {
          statusHtml = `<span class="info-badge badge-available"><i class="fas fa-check-circle"></i> ${enrolled}/${capacity} (${available} seats available)</span>`;
          courseSelect.classList.add('valid');
          courseSelect.classList.remove('invalid');
          courseMsg.innerHTML = '<i class="fas fa-check-circle"></i> <span>Course selected - Seats available</span>';
          courseMsg.classList.add('success');
          courseMsg.classList.remove('error');
          submitBtn.disabled = false;
        } else {
          statusHtml = `<span class="info-badge badge-full"><i class="fas fa-times-circle"></i> FULL - No seats available</span>`;
          courseSelect.classList.add('invalid');
          courseSelect.classList.remove('valid');
          courseMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>This course is full! Please select another course</span>';
          courseMsg.classList.add('error');
          courseMsg.classList.remove('success');
          submitBtn.disabled = true;
        }
        document.getElementById('courseStatus').innerHTML = statusHtml;
        courseInfo.classList.add('show');
      } else {
        courseInfo.classList.remove('show');
        courseSelect.classList.add('invalid');
        courseSelect.classList.remove('valid');
        courseMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>Please select a course</span>';
        courseMsg.classList.add('error');
        courseMsg.classList.remove('success');
        submitBtn.disabled = true;
      }
      updateSelectedCount();
    }

    // Update selected count stat
    function updateSelectedCount() {
      const studentSelected = document.getElementById('studentId').value !== '';
      const courseSelected = document.getElementById('courseId').value !== '';
      const countDiv = document.getElementById('selectedCount');

      if (studentSelected && courseSelected) {
        countDiv.innerHTML = '✓ Ready';
        countDiv.style.color = '#10b981';
      } else if (studentSelected || courseSelected) {
        countDiv.innerHTML = '1/2';
        countDiv.style.color = '#f59e0b';
      } else {
        countDiv.innerHTML = '0/2';
        countDiv.style.color = '#64748b';
      }
    }

    // Full form validation
    function validateFormFields() {
      const studentValid = document.getElementById('studentId').value !== '';
      const courseValid = document.getElementById('courseId').value !== '';
      const submitBtn = document.getElementById('submitBtn');

      if (studentValid && courseValid) {
        const courseData = getCourseData();
        if (parseInt(courseData.available) > 0) {
          submitBtn.disabled = false;
          return true;
        }
      }
      submitBtn.disabled = true;
      return false;
    }

    function validateForm() {
      const studentValid = document.getElementById('studentId').value !== '';
      const courseValid = document.getElementById('courseId').value !== '';

      if (!studentValid) {
        document.getElementById('studentId').focus();
        showStudentInfo();
        return false;
      }
      if (!courseValid) {
        document.getElementById('courseId').focus();
        showCourseInfo();
        return false;
      }

      const courseData = getCourseData();
      if (parseInt(courseData.available) === 0) {
        alert('This course is full! Please select another course.');
        document.getElementById('courseId').focus();
        return false;
      }

      return true;
    }

    // Event listeners
    document.getElementById('studentId').addEventListener('change', showStudentInfo);
    document.getElementById('courseId').addEventListener('change', showCourseInfo);

    // Auto-hide toast
    setTimeout(() => {
      const toast = document.getElementById('errorToast');
      if (toast) toast.style.display = 'none';
    }, 5000);

    // Initial validation
    setTimeout(() => {
      showStudentInfo();
      showCourseInfo();
    }, 100);
</script>
</body>
</html>
