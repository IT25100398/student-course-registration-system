<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: common-header"></head>
<body>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-user-plus"></i> Add New User</h1>
        <p>Create a new system user with role-based access</p>
    </div>

    <div class="form-card">
        <form id="userForm" th:action="@{/users/add}" th:object="${user}" method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" th:field="*{username}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="fullName" name="fullName" th:field="*{fullName}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" th:field="*{email}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" th:field="*{password}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-tag input-icon"></i>
                        <select id="role" name="role" th:field="*{role}" required>
                            <option value="">Select Role</option>
                            <option value="ADMIN">👑 Admin</option>
                            <option value="STAFF">👔 Staff</option>
                            <option value="STUDENT">🎓 Student</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="phone" name="phone" th:field="*{phone}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <div class="input-wrapper">
                        <i class="fas fa-toggle-on input-icon"></i>
                        <select id="status" name="status" th:field="*{status}">
                            <option value="ACTIVE">✅ Active</option>
                            <option value="INACTIVE">❌ Inactive</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Create User</button>
                <a href="/users" class="btn-cancel"><i class="fas fa-times"></i> Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
    .page-header {
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        border-radius: 20px;
        padding: 30px 35px;
        margin-bottom: 25px;
        color: white;
    }
    .form-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }
    .form-group {
        margin-bottom: 5px;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1e293b;
    }
    .required { color: #ef4444; }
    .input-wrapper {
        position: relative;
    }
    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 12px 16px 12px 42px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: #4f46e5;
    }
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid #e2e8f0;
    }
    .btn-save {
        padding: 12px 28px;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
    }
    .btn-cancel {
        padding: 12px 28px;
        background: #f1f5f9;
        color: #475569;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
    }
    @media (max-width: 768px) {
        .form-grid { grid-template-columns: 1fr; }
        .form-actions { flex-direction: column; }
    }
</style>
</body>
</html>
